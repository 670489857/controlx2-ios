name: probe-macos

# 一次性探针：只回答一个问题——这个仓库现在能不能拿到 macOS runner。
# 构建作业被「排队后直接取消」时，代码侧无法判断是镜像、额度还是仓库可见性，
# 用一个只有 sw_vers 的作业把它区分开。
on:
  workflow_dispatch:
    inputs:
      image:
        description: runner 镜像
        default: macos-14
        type: choice
        options: [macos-14, macos-15, macos-latest]

jobs:
  probe:
    name: macOS runner 探针
    runs-on: ${{ inputs.image }}
    timeout-minutes: 10
    steps:
      - name: 环境
        run: |
          sw_vers
          xcodebuild -version
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
