name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 协议层在 Linux 上跑，省 macOS 额度，几秒出结果
  test:
    name: 协议层测试
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --parallel

  # 真正的 iOS 编译：需要 macOS runner + Xcode
  build:
    name: 构建未签名 IPA
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # commit 计数与短 SHA 都需要完整历史，浅克隆会让构建号漂移
          fetch-depth: 0

      # 版本号只有一个来源：仓库根的 VERSION 文件。
      # 构建号用提交数（单调递增、与代码状态一一对应），短 SHA 用于精确定位。
      - name: 解析版本
        id: ver
        run: |
          set -euo pipefail
          APP_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::VERSION 文件为空"
            exit 1
          fi
          SPEC_VERSION=$(grep -oE 'MARKETING_VERSION: *"[^"]+"' project.yml | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "VERSION=$APP_VERSION  project.yml=$SPEC_VERSION"
          if [ "$APP_VERSION" != "$SPEC_VERSION" ]; then
            echo "::error::版本号不一致：VERSION 是 $APP_VERSION，project.yml 是 $SPEC_VERSION"
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "版本 $APP_VERSION / 构建 $BUILD_NUMBER / $SHA"
          {
            echo "version=$APP_VERSION"
            echo "build=$BUILD_NUMBER"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          BUILD_GIT_SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ControlX2.xcodeproj \
            -scheme ControlX2 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            BUILD_GIT_SHA="$BUILD_GIT_SHA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | xcpretty 2>/dev/null || \
            (grep -E "error:|warning: .*deprecated|BUILD FAILED" build.log | head -60; exit 1)

      - name: 打包 IPA
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ControlX2.app"
          test -d "$APP" || { echo "找不到 .app，编译未产出"; exit 1; }

          # 核对注入是否真的生效：Info.plist 没被改写的话，文件名上的版本就是假的
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          PLIST_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          PLIST_SHA=$(/usr/libexec/PlistBuddy -c "Print :BuildGitSHA" "$APP/Info.plist" 2>/dev/null || echo "")
          echo "plist: $PLIST_VERSION ($PLIST_BUILD) $PLIST_SHA"
          if [ "$PLIST_VERSION" != "$APP_VERSION" ] || [ "$PLIST_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::Info.plist 版本未按预期注入，产物会名不副实"
            exit 1
          fi

          NAME="ControlX2-$APP_VERSION-b$BUILD_NUMBER-$SHA"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry "$NAME.ipa" Payload && rm -rf Payload)
          ls -lh "dist/$NAME.ipa"

          {
            echo "version: $APP_VERSION"
            echo "build: $BUILD_NUMBER"
            echo "sha: $SHA"
            echo "commit_time: $(git log -1 --format=%cI)"
            echo "branch: ${GITHUB_REF_NAME}"
            echo "workflow_run: $GITHUB_RUN_ID"
            echo "ipa: $NAME.ipa"
            echo "size_bytes: $(stat -f%z "dist/$NAME.ipa")"
          } > dist/build-info.txt
          cat dist/build-info.txt
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 写入构建摘要
        run: |
          {
            echo "### ControlX2 ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }})"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| IPA | \`${IPA_NAME}.ipa\` |"
            echo "| 提交 | \`${{ steps.ver.outputs.sha }}\` |"
            echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 产物名带版本，历史构建不会互相盖住
          name: ControlX2-${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}
          path: dist/
          retention-days: 90

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-b${{ steps.ver.outputs.build }}
          path: build.log
          retention-days: 7
