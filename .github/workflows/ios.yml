name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 协议层在 Linux 上跑，省 macOS 额度，几秒出结果
  test:
    name: 协议层测试
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --parallel

  # 真正的 iOS 编译：需要 macOS runner + Xcode
  build:
    name: 构建未签名 IPA
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project ControlX2.xcodeproj \
            -scheme ControlX2 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | xcpretty 2>/dev/null || \
            (grep -E "error:|warning: .*deprecated|BUILD FAILED" build.log | head -60; exit 1)

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/ControlX2.app"
          test -d "$APP" || { echo "找不到 .app，编译未产出"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ControlX2-unsigned.ipa Payload
          ls -lh ControlX2-unsigned.ipa
          echo "BundleSwift 路径: $(find Payload -name 'PumpX2Kit*' -o -name '*.swiftmodule' | head -5)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ControlX2-unsigned-ipa
          path: ControlX2-unsigned.ipa
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
