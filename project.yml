name: ControlX2
options:
  bundleIdPrefix: org.controlx2
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PumpX2Kit:
    path: .

targets:
  ControlX2:
    type: application
    platform: iOS
    sources:
      - path: App
      # 锁屏即时动态的数据契约要和 App 共用同一份定义，否则两边字段会漂
      - path: LiveActivity/Shared
    dependencies:
      - package: PumpX2Kit
        product: PumpX2Kit
      - package: PumpX2Kit
        product: PumpX2BLE
      - package: PumpX2Kit
        product: X2Advisor
      # 小组件扩展随主 App 一起嵌入
      - target: LoopLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.controlx2.app
        # 版本号的单一来源是仓库根目录的 VERSION 文件，CI 会校验两处一致后用
        # 它覆盖这里。本地直接开 Xcode 时这两个值就是兜底值。
        MARKETING_VERSION: "0.10.4"
        CURRENT_PROJECT_VERSION: "1"
        BUILD_GIT_SHA: "local"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ControlX2
        # 必须显式绑定：xcodegen 在没写这两项时会填死 1.0 / 1，
        # 于是 xcodebuild 的 MARKETING_VERSION 覆盖对 Info.plist 完全无效，
        # 产物文件名上的版本就成了假的。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 装完后能在 App 内核对「手里这个包对应哪个提交」，不用回 CI 翻日志
        BuildGitSHA: "$(BUILD_GIT_SHA)"
        UILaunchScreen: {}
        # 锁屏即时动态（ActivityKit）。没有这个键，Activity.request 会直接失败
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - bluetooth-central
          # 静音音频保活：iOS 只给「正在播放音频」的 App 后台运行权，
          # 这是让闭环在锁屏后继续跑的唯一可靠手段（需要用户在设置里手动打开）
          - audio
        NSBluetoothAlwaysUsageDescription: 需要蓝牙权限以连接并读取胰岛素泵状态。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙权限以连接并读取胰岛素泵状态。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # 锁屏即时动态的小组件。只负责显示，没有任何写操作入口。
  LoopLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity/Widget
      - path: LiveActivity/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.controlx2.app.LoopLiveActivity
        MARKETING_VERSION: "0.10.4"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: ControlX2 动态
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
