name: ControlX2
options:
  bundleIdPrefix: org.controlx2
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PumpX2Kit:
    path: .

targets:
  ControlX2:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PumpX2Kit
        product: PumpX2Kit
      - package: PumpX2Kit
        product: PumpX2BLE
      - package: PumpX2Kit
        product: X2Advisor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.controlx2.app
        # 版本号的单一来源是仓库根目录的 VERSION 文件，CI 会校验两处一致后用
        # 它覆盖这里。本地直接开 Xcode 时这两个值就是兜底值。
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        BUILD_GIT_SHA: "local"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ControlX2
        # 必须显式绑定：xcodegen 在没写这两项时会填死 1.0 / 1，
        # 于是 xcodebuild 的 MARKETING_VERSION 覆盖对 Info.plist 完全无效，
        # 产物文件名上的版本就成了假的。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 装完后能在 App 内核对「手里这个包对应哪个提交」，不用回 CI 翻日志
        BuildGitSHA: "$(BUILD_GIT_SHA)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: 需要蓝牙权限以连接并读取胰岛素泵状态。
        NSBluetoothPeripheralUsageDescription: 需要蓝牙权限以连接并读取胰岛素泵状态。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
